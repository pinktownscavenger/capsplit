[project]
name = "capsplit"
version = "0.1.0"
description = "Exact split of RL policy improvement into reliability gain and capability gain"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
deep = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
