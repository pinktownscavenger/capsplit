[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capsplit"
version = "0.1.0"
description = "Exact split of RL policy improvement into reliability gain and capability gain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
deep = ["torch"]
viz = ["matplotlib"]
# Language-model experiment (docs/lm_design.md). Versions are the ones verified on the authors' machine.
lm = ["torch==2.8.0", "transformers==5.23.0", "peft==0.22.0", "huggingface_hub==2.4.0", "safetensors==0.8.0", "psutil==7.2.2"]
lint = ["ruff==0.17.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "experiments"]
markers = ["slow: takes more than a few seconds"]
